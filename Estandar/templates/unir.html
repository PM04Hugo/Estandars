{% extends 'base.html' %}
{% load static %}

{% block title %}{{ Match }}{% endblock %}

{% block content %}

<div style="
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 4rem;
  background-color: #f5f5f5;
">

    
    <div style="
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.1);
        padding: 2.5rem;
        width: 100%;
        max-width: 720px;
    ">
        {% load user_tags %}

        <form class="fs-form fs-layout__2-column" method="POST">
            {% csrf_token %}
            <fieldset>
                <div>
                    <label class="fs-label" for="medida">Medida</label>
                    <input class="fs-input" type="text" id="medida" name="medida" onchange="compMedida()" placeholder="Escribe una medida..."required/>
                    <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <input class="fs-checkbox" name="crearMedida" type="checkbox" id="crearMedida" onchange="compMedida()"/>
                        <label for="crearMedida" style="font-size: 0.85rem; color: gray;">Crear nueva medida</label>
                    </div>
                </div>
                <div class>
                    <label class="fs-label" for="unidades">
                        Unidades
                    </label>
                    <input class="fs-input" type="text" id="unidades" name="unidades" onchange="compUnidad()" placeholder="Escribe una unidad..."required/>
                    <div style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.5rem;">
                        <input type="checkbox" name="crearUnidad" class="fs-checkbox" id="crearUnidad" onchange="compUnidad()"/>
                        <label for="crearUnidad" style="font-size: 0.85rem; color: gray;">Crear nueva unidad</label>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <div>
                    <label class="fs-label" for="minimo">Minimo</label>
                    <input class="fs-input" type="text" id="minimo" name="minimo"  placeholder="100"required/>
                </div>
                 <div>
                    <label class="fs-label" for="maximo">Máximo</label>
                    <input class="fs-input" type="text" id="maximo" name="maximo"  placeholder="200"required/>
                </div>
                
            </fieldset>
            <div class="fs-button-group">
                <button class="fs-button" name="submit" id="botton" type="submit">Unir</button>
            </div>
        </form>
    </div> 


</div>

<script>

const medidasValidas = [{% for m in medidas %}"{{ m.nombre|lower }}",{% endfor %}];
const unidadesValidas = [{% for u in unidades %}"{{ u.nombre|lower }}",{% endfor %}];
    
    function compMedida() {
        var input = document.getElementById('medida');
        var medida = document.getElementById('medida').value.trim();
        var crear = document.getElementById('crearMedida').checked;
        medida=medida.toLowerCase();
        if (crear) {
            if(medidasValidas.includes(medida))
            {
                document.getElementById('medida').style.borderColor = 'red';
                input.setCustomValidity("Esta medida ya existe");
                input.reportValidity();
            }
            else{
                document.getElementById('medida').style.borderColor = 'blue';
                input.setCustomValidity("");
            }
        } else {
            if (!medidasValidas.includes(medida)) {
                document.getElementById('botton').style.borderColor = 'red'
                input.setCustomValidity("Esta medida no existe. Elige una de la lista");
                input.reportValidity();

            } else {
                document.getElementById('botton').style.borderColor = 'green';
                input.setCustomValidity("");
            }
        }
        actualizarBoton();
    }

    function compUnidad() {
        var input = document.getElementById('unidades');
        var unidad = document.getElementById('unidades').value.trim();
        var crear = document.getElementById('crearUnidad').checked;
        unidad=unidad.toLowerCase();
        if (crear) {
            if(unidadesValidas.includes(unidad))
            {
                document.getElementById('unidades').style.borderColor = 'red';
                input.setCustomValidity("Esta medida ya existe");
                input.reportValidity();
            }
            else{
                document.getElementById('unidades').style.borderColor = 'blue';
                input.setCustomValidity("");
            }
        } else {
            if (!unidadesValidas.includes(unidad)) {
                document.getElementById('botton').style.borderColor = 'red'
                input.setCustomValidity("Esta unidad no existe. Elige una de la lista");
                input.reportValidity();
                
            } else {
                document.getElementById('unidades').style.borderColor = 'green'
                input.setCustomValidity("");
            }
        }
        actualizarBoton();
    }

    function actualizarBoton() {
        var medida = document.getElementById('medida').value.trim().toLowerCase();
        var unidad = document.getElementById('unidades').value.trim().toLowerCase();
        var boton = document.getElementById('botton');
        var crearMedida = document.getElementById('crearMedida').checked;
        var crearUnidad = document.getElementById('crearUnidad').checked;

        if(!(medida=='') && !(unidad=='')){

                //PAra que pueda haber una creado y otro no
                var medidaOk = crearMedida || medidasValidas.includes(medida);
                var unidadOk = crearUnidad || unidadesValidas.includes(unidad);
        
            if (medidaOk && unidadOk) {
                boton.disabled = false;
                boton.style.backgroundColor = 'green';
                boton.style.cursor = 'pointer';
            } else {
                boton.disabled = true;
                boton.style.backgroundColor = 'red';
                boton.style.cursor = 'not-allowed';
            }
        }
    }
</script>

{% endblock %}
