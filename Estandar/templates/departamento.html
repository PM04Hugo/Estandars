{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Departamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: var(--color-background);
            gap: 2rem;
            padding: 2rem;
        }

        .dept-title {
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-text-muted);
        }

        .dept-grid {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .dept-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            background: white;
            border-radius: 0.5rem;
            border: 1px solid var(--color-border-default);
            padding: 1.25rem;
            transition-duration: 200ms;
            transition-property: box-shadow, border-color, transform;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dept-card:hover {
            border-color: var(--color-border-active);
            box-shadow: 0 4px 16px rgba(35,73,76,0.12);
            transform: translateY(-2px);
        }

        .dept-card img {
            border-radius: 0.375rem;
            object-fit: cover;
            display: block;
        }

        .dept-label {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-text-default);
        }

        .registro-link {
            position: fixed;
            top: 1.25rem;
            right: 1.5rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 0.85rem;
            border-radius: 0.375rem;
            border: 1px solid var(--color-border-default);
            transition-duration: 150ms;
            transition-property: background-color, border-color, color;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        .registro-link:hover {
            background-color: white;
            border-color: var(--color-border-active);
            color: var(--color-primary);
        }
    </style>
</head>
<body>

    <a href="{% url 'registro' %}" class="registro-link">Registro</a>

    <p class="dept-title">Selecciona un departamento</p>

    <div class="dept-grid">
        <a href="{% url 'login' 1 %}" class="dept-card">
            <img src="{% static 'img/the_pitt.jpg' %}" alt="Urgencias" width="150" height="200">
            <span class="dept-label">Urgencias</span>
        </a>
        <a href="{% url 'login' 2 %}" class="dept-card">
            <img src="{% static 'img/house.jpg' %}" alt="Diagnóstico" width="150" height="200">
            <span class="dept-label">Diagnóstico</span>
        </a>
        <a href="{% url 'login' 3 %}" class="dept-card">
            <img src="{% static 'img/new_amsterdam.jpg' %}" alt="General" width="150" height="200">
            <span class="dept-label">General</span>
        </a>
    </div>

</body>
</html>
