{% extends 'base.html' %}
{% load static %}
{% load user_tags %}

{% block title %}{{ EEscoger }}{% endblock %}

{% block content %}

<style>
.menu-container {
    height: calc(100vh - 56px);
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: var(--color-background);
}
</style>

<div class="menu-container">
    <div style="max-width: 600px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
        <h2 style="font-size: 1.5rem; font-weight: 600; color: var(--color-text-default); text-align: center;">¿Qué deseas hacer?</h2>
        <div style="display: flex; gap: 0.75rem; width: 100%;">
            <a href="documento/" class="fs-button" style="flex: 1; text-align: center; text-decoration: none;">
                Crear
            </a>
            <a href="proyecto_listar/" class="fs-button" style="flex: 1; text-align: center; text-decoration: none; background-color: white; color: var(--color-primary); box-shadow: var(--color-border-default) 0 0 0 1px inset;">
                Listar
            </a>
            <a href="proyecto_abrir/" class="fs-button" style="flex: 1; text-align: center; text-decoration: none;   box-shadow: var(--color-border-default) 0 0 0 1px inset;">
                Abrir
            </a>
        </div>
        <a href="{% if request.user|es_admin %}{% url 'administrador' %}{% else %}{% url 'base' %}{% endif %}" style="color: var(--color-text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;">
            ← Volver
        </a>
    </div>
</div>

{% endblock %}
