{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width: 600px;">
  <h4 class="mb-4">Confirmar transformaciones</h4>
  <form method="post">
    {% csrf_token %}
    <div class="d-flex flex-column gap-3 mb-4">
      {% for i, t in transformaciones %}
      <div class="card p-3">
        <div class="d-flex align-items-center justify-content-between">
          <div>
            <strong>{{ t.columna }}</strong>
            <span class="text-muted ms-2">{{ t.de }} → {{ t.a }}</span>
          </div>
          <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox"
                   name="aceptadas" value="{{ i }}" checked>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    <button type="submit" class="btn btn-primary w-100">Aplicar y continuar</button>
  </form>
</div>
{% endblock %}
