{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Departamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--color-background);
            padding: 2rem;
        }

        .registro-card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .registro-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-text-default);
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .registro-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .alert-error {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 0.375rem;
            padding: 0.75rem 1rem;
            font-size: 0.875rem;
            text-align: center;
        }

        .btn-submit {
            background-color: var(--color-primary);
            border-radius: 0.375rem;
            color: white;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 1rem 2rem;
            width: 100%;
            transition-duration: 200ms;
            transition-property: background-color;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background-color: var(--color-primary-active);
        }

        .btn-submit:focus-visible {
            background-color: var(--color-primary-active);
            outline: 3px solid var(--color-highlight);
        }
    </style>
</head>
<body>

    
    <div class="registro-card">
        <a href="{% url 'departamento' %}" class="btn-volver" style="color: var(--color-text-muted); text-decoration: none; font-size: 0.875rem; font-weight: 500;">
            ← Volver
        </a>
        
        <h4 class="registro-title">Registro de Usuario</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST" class="registro-form">
            {% csrf_token %}

            <div class="fs-field">
                <label class="fs-label" for="usuario">Usuario</label>
                <input class="fs-input" type="text" id="usuario" name="usuario" placeholder="Escribe tu usuario..." required>
            </div>

            <div class="fs-field">
                <label class="fs-label" for="password">Contraseña</label>
                <input class="fs-input" type="password" id="password" name="password" placeholder="Escribe tu contraseña..." required>
            </div>

            <div class="fs-field">
                <label class="fs-label" for="departamento">Departamento</label>
                <select class="fs-select" id="departamento" name="departamento">
                    <option value="1">Urgencias</option>
                    <option value="2">Diagnóstico</option>
                    <option value="3">General</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Registrar</button>
        </form>
    </div>

</body>
</html>
