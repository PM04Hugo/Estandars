{% load static %}
{% load user_tags %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Estandar{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>

<div class="d-flex align-items-center justify-content-between mb-4">
    <div>
        <a href="{% if request.user|es_admin %}{% url 'administrador' %}{% else %}{% url 'base' %}{% endif %}">
                ← Volver
            </a>
      <h4 class="mb-1 fw-semibold">{{ proyecto.nombre }}</h4>
      <small class="text-muted">
        <i class="bi bi-patch-check me-1"></i>Estándar: {{ proyecto.estandard }}
      </small>
    </div>
</div>

<div class="d-flex gap-3 mb-3 small">
    <span class="badge bg-success px-3 py-2">OK</span>
    <span class="badge bg-warning text-dark px-3 py-2">Cuidado</span>
    <span class="badge bg-danger px-3 py-2">Urgente</span>
    <span class="badge px-3 py-2" style="background:#222;color:#fff">Peligro</span>
</div>

<main>
    {% block content %}
    {% endblock %}
</main>

<div class="offcanvas offcanvas-end" tabindex="-1" id="panelErrores" aria-labelledby="panelErroresLabel">
  <div class="offcanvas-header border-bottom">
    <div class="d-flex align-items-center gap-2">
        <h5 class="offcanvas-title mb-0" id="panelErroresTitulo">Paciente</h5>
        
    </div>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body" id="panelErroresBody"></div>
  <div>
  <button type="button" class="btn btn-sm btn-outline-secondary" onclick="accionPanel()">
            <i class="bi bi-three-dots">Confirmar</i>
        </button>
    </div>
</div>

</body>
</html>
